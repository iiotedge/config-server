spring:
  security:
    user:
      # Required - no fallback, same reasoning as eureka-server's own prod
      # profile: a real deployment must supply a real, dedicated credential.
      name: ${SPRING_SECURITY_CONFIG_USERNAME}
      password: ${SPRING_SECURITY_CONFIG_PASSWORD}
  cloud:
    config:
      server:
        git:
          uri: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI}
          clone-on-start: true
          username: ${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME}
          password: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
          default-label: ${CONFIG_GIT_BRANCH:main}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server.default.svc.cluster.local:8761/eureka/}
