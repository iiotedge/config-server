spring:
  security:
    user:
      name: ${SPRING_SECURITY_CONFIG_USERNAME:admin}
      password: ${SPRING_SECURITY_CONFIG_PASSWORD:config-dev-only}
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/S-8506/configuration.git"
          clone-on-start: true
          username: "${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME:S-8506}"
          # Was a real, live-shaped GitHub PAT committed in plaintext here
          # (in this file's git history since 2025-04-03, over a year
          # before this fix). No safe fallback value exists for a real
          # credential the way "8506" was an acceptable shared dev DB
          # password elsewhere on this platform - blank means the git
          # clone simply fails locally until a real (ideally
          # read-only, repo-scoped) token is exported, which is the
          # correct failure mode for a leaked-and-therefore-dead secret.
          # The actual token itself still needs revoking on GitHub's
          # side - removing it from this file doesn't undo the exposure.
          password: "${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD:}"
          default-label: "main"

eureka:
  client:
    service-url:
      # Was hardcoded with no env-var override at all - unlike every
      # other profile's own eureka config on this platform - which broke
      # container-to-container registration (e.g. the shared
      # data-ingestion-service/docker-compose.yml stack, where
      # "localhost" doesn't reach the eureka-server container).
      defaultZone: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}"
