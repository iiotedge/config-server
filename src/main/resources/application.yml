spring:
  application:
    name: config-server
  profiles:
    # Was "${SPRING_PROFILES_ACTIVE:prod} # Default profile is dev" - the
    # comment and the code disagreed (prod is what actually wins when the
    # env var is unset). Kept prod as the real default - falling back to
    # dev's hardcoded git PAT if this env var were ever left unset in a
    # real deployment would have been the actual vulnerability, not a
    # theoretical one - just fixed the comment to say what the code
    # actually does.
    active: ${SPRING_PROFILES_ACTIVE:prod}

server:
  port: ${SERVER_PORT:8888}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        # Was health,info only - added prometheus (dependency previously
        # absent entirely). Only /actuator/health is actually
        # unauthenticated - see SecurityConfig.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
